aid: securew2
name: SecureW2
description: >-
  SecureW2 is a cloud-native, certificate-based network security platform whose
  JoinNow suite delivers passwordless authentication through Dynamic PKI, managed
  device onboarding, and a multi-tenant Cloud RADIUS service for 802.1X Wi-Fi and
  wired access. Its public REST API lets Managed Service Providers programmatically
  provision and manage child organizations, and its certificate-issuance APIs
  automate EAP-TLS enrollment across MDM, IdP, and RMM integrations. SecureW2 is
  backed by Insight Partners and focuses on continuous, identity- and risk-aware
  trust for both human and non-human identities.
